<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karthikeyan B — Product Designer</title>
    <!-- the cartoon avatar: round in the browser tab, on its mint square for iPhone home screens -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="Karthikeyan B — product designer and front-end developer in Chennai. Turning user problems into working products: case studies, design work and the code behind them." />
    <meta name="theme-color" content="#1e3a34" />
    <!-- the page colour before the stylesheet arrives: never a white flash -->
    <style>html { background: #0a0b0c; } html[data-theme='light'] { background: #eceef0; }</style>
    <script>
      // Before anything paints: the theme the visitor chose (the night garden on
      // a first visit — the same rule as src/theme.ts), so the page never opens
      // in the wrong colours; and the landing picture for that theme and screen
      // starts downloading now, not once the app's code has loaded. Keep the
      // paths in step with `intro` in src/data.ts.
      ;(function () {
        var theme = 'dark'
        try {
          var v = localStorage.getItem('portfolio:theme:v3')
          if (v === 'light' || v === 'dark') theme = v
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        // a direct link to a case study opens on its own banner, not the landing
        if (location.hash.indexOf('#/project/') === 0) return
        var phone = window.matchMedia('(max-width: 700px)').matches
        var src = theme === 'dark' ? '/night-library.png' : phone ? '/intro/day-library-tall.png' : '/intro/day-library.webp'
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.href = src
        link.setAttribute('fetchpriority', 'high')
        document.head.appendChild(link)
      })()
    </script>
    <meta property="og:title" content="Karthikeyan B — Product Designer" />
    <meta property="og:description" content="Product design and front-end work — case studies, design projects and awards." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arsenal+SC:wght@400;700&family=Carlito:wght@400;700&family=Geist:wght@400..700&family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
