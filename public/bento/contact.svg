  <circle cx="700" cy="410" r="284" fill="none" stroke="#fff" stroke-width="1.20" opacity="0.145"/>
  <line x1="700" y1="410" x2="700" y2="158" stroke="#a6e85b" stroke-width="2" opacity="0.5" stroke-dasharray="3 10"/>
