<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img">
  <defs>
    <linearGradient id="bg-contact" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#14262e"/>
      <stop offset="1" stop-color="#080f13"/>
    </linearGradient>
    <radialGradient id="glow-contact" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#3a9fb0" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3a9fb0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3a9fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-contact" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain-contact" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft-contact" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#bg-contact)"/>
  <rect width="1400" height="1000" fill="url(#glow-contact)"/>
  <g transform="translate(700 455) scale(0.713) translate(-700 -410)">
